# Publish the library crates and the CLI to crates.io.
#
# Triggered by pushing a `v*` tag, or run manually with `dry_run: true` to
# rehearse the whole thing without uploading anything.
#
# The order below is the dependency order and is not negotiable: a crate cannot
# be published until everything it depends on is already on the registry, so
# `luminafx-schema` goes first and `luminafx-cli` last. `cargo publish` waits
# for each crate to appear in the index before returning, so no sleeps are
# needed between steps.
#
# `luminafx-server`, `luminafx-wasm`, `luminafx-bench` and `xtask` are
# `publish = false` and deliberately absent: the server is not yet hardened for
# public deployment (TD-09), the wasm crate ships to npm through wasm-pack
# rather than to crates.io, and the other two are development tools.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Package and verify without uploading"
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install FFmpeg (lumina-export tests shell out to it)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # The tag must match the version in Cargo.toml, or the release publishes
      # something other than what the tag names. Checked before anything is
      # uploaded, because a publish cannot be undone — only yanked.
      - name: Tag matches the workspace version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          manifest=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$manifest" != "$tag" ]; then
            echo "::error::tag v$tag does not match workspace version $manifest"
            exit 1
          fi
          echo "publishing $manifest"

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          DRY: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          set -euo pipefail
          for crate in \
            luminafx-schema \
            luminafx-text \
            luminafx-core \
            luminafx-renderer \
            luminafx-export \
            luminafx-mcp \
            luminafx-cli
          do
            echo "::group::$crate"
            # Already at this version from a re-run or a partial failure: skip
            # rather than fail the whole release. crates.io rejects a duplicate
            # version, and a half-published release should be resumable.
            version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
            if curl -sf -A "lumina-release" \
                 "https://crates.io/api/v1/crates/$crate/$version" >/dev/null; then
              echo "$crate $version is already published — skipping"
              echo "::endgroup::"
              continue
            fi
            cargo publish -p "$crate" $DRY
            echo "::endgroup::"
          done

  # ── PyPI ──────────────────────────────────────────────────────────────────
  #
  # The Python SDK is not a workspace member and does not go to crates.io. It
  # is a maturin project that compiles the engine into a native extension, so
  # it ships as wheels: a source distribution alone would make every user
  # install a Rust toolchain to `pip install`.
  #
  # An sdist is published alongside them anyway, as the fallback for a platform
  # no wheel covers. It only builds once the crates are on crates.io, since
  # packaging strips the path from a path dependency and leaves the version —
  # which is why this job `needs: publish`.

  wheels:
    name: Wheels (${{ matrix.os }})
    needs: publish
    if: ${{ !inputs.dry_run }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          working-directory: sdks/python
          # `manylinux: auto` builds inside the container that makes a Linux
          # wheel installable on distributions older than the runner. A wheel
          # built bare against the runner's glibc claims compatibility it does
          # not have and fails at import time on the user's machine.
          manylinux: auto
          args: --release --out dist
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: wheels-${{ matrix.os }}
          path: sdks/python/dist

  sdist:
    name: Source distribution
    needs: publish
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          working-directory: sdks/python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: wheels-sdist
          path: sdks/python/dist

  pypi:
    name: PyPI
    needs: [wheels, sdist]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          command: upload
          # `--skip-existing` for the same reason the crates.io step checks
          # before publishing: a re-run after a partial failure should finish
          # the release rather than fail on what already succeeded.
          args: --non-interactive --skip-existing dist/*
