name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

# Supersede in-flight runs of the same branch/PR instead of queueing behind
# them (but never cancel a main run mid-deploy).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ── Format ────────────────────────────────────────────────────────────────────
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  # ── Clippy ────────────────────────────────────────────────────────────────────
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install FFmpeg (needed by lumina-export)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: cargo clippy --workspace --all-targets

  # ── Tests (3-OS matrix) ──────────────────────────────────────────────────────
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install FFmpeg and a software Vulkan driver (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg mesa-vulkan-drivers
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      # LUMINA_REQUIRE_VELLO turns "no wgpu adapter" from a silent skip into a
      # test failure, so backend parity can never quietly stop being checked.
      # Required on Linux (lavapipe is installed above); macOS keeps the
      # graceful skip via the Metal fallback adapter.
      #
      # LUMINA_DISABLE_VELLO stops the probe before it starts on Windows: the
      # first matrix run showed DX12-WARP aborting the test process (exit 2173,
      # two tests never reporting) rather than returning an error the skip path
      # could catch. Parity is verified on Linux; TD-20 tracks re-enabling it.
      - run: cargo test --workspace --exclude luminafx-wasm --exclude luminafx-bench
        env:
          LUMINA_REQUIRE_VELLO: ${{ runner.os == 'Linux' && '1' || '0' }}
          LUMINA_DISABLE_VELLO: ${{ runner.os == 'Windows' && '1' || '0' }}
      - name: Upload parity-failure images
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: parity-failures-${{ matrix.os }}
          path: target/parity-failures/
          if-no-files-found: ignore

  # ── MSRV ──────────────────────────────────────────────────────────────────────
  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # Keep in lockstep with [workspace.package] rust-version.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo check --workspace --exclude luminafx-wasm --exclude luminafx-bench --all-targets

  # ── Docs ──────────────────────────────────────────────────────────────────────
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo doc --no-deps --workspace --exclude luminafx-wasm --exclude luminafx-bench

  # ── WASM Build ────────────────────────────────────────────────────────────────
  wasm:
    name: WASM Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - run: wasm-pack build crates/lumina-wasm --target web
      - name: Run wasm-bindgen tests (Node)
        run: wasm-pack test --node crates/lumina-wasm

  # ── cargo-deny ────────────────────────────────────────────────────────────────
  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    # Only on pull requests: the comparison is PR-versus-merge-base, so there
    # is nothing to compare on a push to main.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Need the merge base to measure against.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install critcmp
        run: cargo install critcmp --locked
      # Both sides are measured back to back on the *same* runner. Comparing
      # against a stored baseline from an earlier job would report double-digit
      # swings on identical code, because GitHub runner performance varies far
      # more between jobs than most real regressions do.
      # `cargo bench` directly rather than `cargo xtask bench`: the merge base
      # is arbitrary older code, and it cannot be assumed to have whatever
      # tasks the current xtask defines. The flags are kept in step with
      # `run_bench` in xtask/src/main.rs.
      # `--manifest-path`, not `-p`: this job checks out the *merge base* to get
      # a baseline, and a package renamed in this PR does not exist under its
      # new name at that revision. The directory does exist at both, which is
      # one of the reasons the crates.io rename (ADR-0014) left directory names
      # alone. Addressing the crate by path makes the comparison work across
      # any future rename too.
      - name: Measure the merge base
        run: |
          git checkout --detach ${{ github.event.pull_request.base.sha }}
          cargo bench --manifest-path crates/lumina-bench/Cargo.toml \
            -- --warm-up-time 1 --measurement-time 3 \
            --save-baseline base
      - name: Measure this pull request
        run: |
          git checkout --detach ${{ github.sha }}
          cargo bench --manifest-path crates/lumina-bench/Cargo.toml \
            -- --warm-up-time 1 --measurement-time 3 \
            --save-baseline pr
      - name: Compare
        run: |
          critcmp base pr | tee bench-comparison.txt
      - name: Fail on a large regression
        run: |
          # The threshold is 25%, not the 5% the programme originally proposed.
          # Same-runner comparison removes most cross-job variance, but not all
          # of it: a shared CI machine still drifts by more than 5% between two
          # runs of the same code. A gate that fires on noise gets disabled, and
          # ENGINEERING_PRINCIPLES #6 treats a flaky test as a bug.
          #
          # 25% is comfortably above that floor and comfortably below the size
          # of the regressions this is meant to catch — removing a cache or
          # reintroducing a per-frame allocation costs far more than a quarter.
          python3 .github/scripts/check_bench_regression.py bench-comparison.txt 25
      - name: Upload comparison
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: benchmark-comparison
          path: bench-comparison.txt
          if-no-files-found: ignore

  examples:
    name: Examples render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      # ENGINEERING_PRINCIPLES #12: a broken example is a broken build. This
      # renders every scene in examples/ with the documented command, which is
      # the only way that principle is actually enforced rather than asserted.
      - run: cargo xtask examples

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # v2 ships a current Cargo that understands Cargo.lock format v4.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check

  # ── Docs site (mdBook) ──────────────────────────────────────────────────────
  book:
    name: Docs Site (mdBook)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: mdbook build docs
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs/book

  # ── Deploy docs to GitHub Pages (main only) ───────────────────────────────────
  deploy-docs:
    name: Deploy Docs Site
    needs: book
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
