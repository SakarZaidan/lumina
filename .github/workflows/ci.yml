name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

# Supersede in-flight runs of the same branch/PR instead of queueing behind
# them (but never cancel a main run mid-deploy).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ── Format ────────────────────────────────────────────────────────────────────
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # ── Clippy ────────────────────────────────────────────────────────────────────
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install FFmpeg (needed by lumina-export)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: cargo clippy --workspace --exclude lumina-wasm --all-targets

  # ── Tests (3-OS matrix) ──────────────────────────────────────────────────────
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install FFmpeg and a software Vulkan driver (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg mesa-vulkan-drivers
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      # LUMINA_REQUIRE_VELLO turns "no wgpu adapter" from a silent skip into a
      # test failure, so backend parity can never quietly stop being checked.
      # Required on Linux (lavapipe is installed above); macOS/Windows rely on
      # Metal / DX12-WARP fallback adapters and keep the graceful skip until
      # the matrix proves them reliable.
      - run: cargo test --workspace --exclude lumina-wasm --exclude lumina-bench
        env:
          LUMINA_REQUIRE_VELLO: ${{ runner.os == 'Linux' && '1' || '0' }}
      - name: Upload parity-failure images
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: parity-failures-${{ matrix.os }}
          path: target/parity-failures/
          if-no-files-found: ignore

  # ── MSRV ──────────────────────────────────────────────────────────────────────
  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep in lockstep with [workspace.package] rust-version.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --exclude lumina-wasm --exclude lumina-bench --all-targets

  # ── Docs ──────────────────────────────────────────────────────────────────────
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --workspace --exclude lumina-wasm --exclude lumina-bench

  # ── WASM Build ────────────────────────────────────────────────────────────────
  wasm:
    name: WASM Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - run: wasm-pack build crates/lumina-wasm --target web
      - name: Run wasm-bindgen tests (Node)
        run: wasm-pack test --node crates/lumina-wasm

  # ── cargo-deny ────────────────────────────────────────────────────────────────
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # v2 ships a current Cargo that understands Cargo.lock format v4.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # ── Docs site (mdBook) ──────────────────────────────────────────────────────
  book:
    name: Docs Site (mdBook)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: mdbook build docs
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book

  # ── Deploy docs to GitHub Pages (main only) ───────────────────────────────────
  deploy-docs:
    name: Deploy Docs Site
    needs: book
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
