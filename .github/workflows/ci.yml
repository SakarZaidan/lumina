name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

# Supersede in-flight runs of the same branch/PR instead of queueing behind
# them (but never cancel a main run mid-deploy).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ── Format ────────────────────────────────────────────────────────────────────
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  # ── Clippy ────────────────────────────────────────────────────────────────────
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install FFmpeg (needed by lumina-export)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: cargo clippy --workspace --all-targets

  # ── Tests (3-OS matrix) ──────────────────────────────────────────────────────
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install FFmpeg and a software Vulkan driver (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg mesa-vulkan-drivers
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      # LUMINA_REQUIRE_VELLO turns "no wgpu adapter" from a silent skip into a
      # test failure, so backend parity can never quietly stop being checked.
      # Required on Linux (lavapipe is installed above); macOS keeps the
      # graceful skip via the Metal fallback adapter.
      #
      # LUMINA_DISABLE_VELLO stops the probe before it starts on Windows: the
      # first matrix run showed DX12-WARP aborting the test process (exit 2173,
      # two tests never reporting) rather than returning an error the skip path
      # could catch. Parity is verified on Linux; TD-20 tracks re-enabling it.
      - run: cargo test --workspace --exclude luminafx-wasm --exclude luminafx-bench
        env:
          LUMINA_REQUIRE_VELLO: ${{ runner.os == 'Linux' && '1' || '0' }}
          LUMINA_DISABLE_VELLO: ${{ runner.os == 'Windows' && '1' || '0' }}
      - name: Upload parity-failure images
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: parity-failures-${{ matrix.os }}
          path: target/parity-failures/
          if-no-files-found: ignore

  # ── MSRV ──────────────────────────────────────────────────────────────────────
  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Keep in lockstep with [workspace.package] rust-version.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo check --workspace --exclude luminafx-wasm --exclude luminafx-bench --all-targets

  # ── Docs ──────────────────────────────────────────────────────────────────────
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo doc --no-deps --workspace --exclude luminafx-wasm --exclude luminafx-bench

  # ── WASM Build ────────────────────────────────────────────────────────────────
  wasm:
    name: WASM Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - run: wasm-pack build crates/lumina-wasm --target web
      - name: Run wasm-bindgen tests (Node)
        run: wasm-pack test --node crates/lumina-wasm

  # ── cargo-deny ────────────────────────────────────────────────────────────────
  # ── Public API ───────────────────────────────────────────────────────────────
  #
  # Now that the crates are on crates.io, a breaking change that merges without
  # a version bump is a breaking change shipped to everyone who wrote
  # `luminafx-core = "0.5"`. `cargo-semver-checks` compares this branch's public
  # API against the published release and fails when the two disagree about what
  # the version number promises — which is ENGINEERING_PRINCIPLES #10 enforced
  # by a tool rather than by remembering.
  #
  # It runs on pull requests only. On `main` the comparison is against a release
  # that may not exist yet for a freshly bumped version, which would be a
  # failure about nothing.
  semver:
    name: Public API (semver)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: cargo-semver-checks
      # Only the published library crates. `luminafx-cli` is a binary whose
      # library exists to be testable, `-server`, `-wasm` and `-bench` are
      # `publish = false`, and none of them has a published baseline to compare
      # against — semver-checks would fail looking for one.
      - name: Compare against the published release
        run: |
          cargo semver-checks check-release \
            -p luminafx-schema \
            -p luminafx-text \
            -p luminafx-core \
            -p luminafx-renderer \
            -p luminafx-export

  # ── JS SDK ───────────────────────────────────────────────────────────────────
  #
  # Builds the package the way a publish does and then looks inside the tarball,
  # because both ways this has failed are invisible to a type-check:
  #
  #   1. The sources import `../wasm/luminafx_wasm`, which is generated rather
  #      than committed. Nothing generated it, so a clean checkout could not
  #      build at all (TD-12).
  #   2. `wasm-pack` writes a `.gitignore` containing `*` into its output
  #      directory, and npm honours `.gitignore` when packing — so the wasm was
  #      silently dropped from the tarball while `npm pack` reported success.
  #
  # Asserting the `.wasm` is present is therefore the whole point of this job.
  # A package that builds, type-checks, and ships none of its WebAssembly is
  # exactly what shipped before anyone looked in the tarball.
  js-sdk:
    name: JS SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: wasm-pack
      - run: npm ci || npm install
        working-directory: sdks/javascript
      - run: npm run typecheck
        working-directory: sdks/javascript
      - name: Pack, and check what actually ended up inside
        working-directory: sdks/javascript
        run: |
          set -euo pipefail
          npm pack
          tar tzf luminafx-*.tgz | sort | tee /tmp/contents.txt
          for required in \
            package/dist/index.js \
            package/dist/index.mjs \
            package/dist/index.d.ts \
            package/wasm/luminafx_wasm.js \
            package/wasm/luminafx_wasm_bg.wasm
          do
            grep -qx "$required" /tmp/contents.txt || {
              echo "::error::$required is missing from the published tarball"
              exit 1
            }
          done
          echo "tarball contains the bundle and the wasm"

  # ── Python SDK ───────────────────────────────────────────────────────────────
  #
  # The SDK is its own Cargo workspace, built only through maturin, so no other
  # job compiles it. That is how `luminafx.validate` went on accepting scenes
  # every other entry point rejects without anything noticing (TD-13). This
  # builds the extension the way `pip install` does and runs its tests.
  python-sdk:
    name: Python SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: sdks/python -> target
      - name: Build the extension and run its tests
        working-directory: sdks/python
        run: |
          set -euo pipefail
          python3 -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install pytest .
          pytest -q tests

  # ── Coverage ─────────────────────────────────────────────────────────────────
  #
  # `planning/METRICS.md` carried "n/a" in the coverage row for two releases. A
  # number nobody measures is a number that only ever gets asserted, so this
  # measures it and fails when it drops.
  #
  # The gate ratchets rather than aims: it sits just below the measured figure,
  # so it catches a regression today and is raised as coverage rises. Setting it
  # at the 85% target while the real number is lower would mean a permanently
  # red job, which is the same as no job at all.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install FFmpeg and a software Vulkan driver
        run: sudo apt-get update && sudo apt-get install -y ffmpeg mesa-vulkan-drivers
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: cargo-llvm-cov
      # `xtask` and the `main.rs` entry points are excluded, and the exclusions
      # are the honest kind rather than the convenient kind: `xtask` is the
      # build tool that runs the tests, and a `main` that parses argv and calls
      # one function has nothing to cover that its library does not already.
      # Everything that decides anything is measured.
      - name: Measure
        env:
          LUMINA_REQUIRE_VELLO: "1"
        run: |
          cargo llvm-cov --workspace \
            --exclude luminafx-wasm --exclude luminafx-bench --exclude xtask \
            --ignore-filename-regex 'main\.rs$' \
            --summary-only | tee coverage.txt
      - name: Gate
        run: |
          pct=$(grep -E '^TOTAL' coverage.txt | awk '{print $(NF-3)}' | tr -d '%')
          echo "line coverage: ${pct}%"
          awk -v p="$pct" -v f=80 'BEGIN {
            if (p+0 < f+0) {
              printf "::error::coverage %.2f%% is below the %d%% floor\n", p, f
              exit 1
            }
            printf "coverage %.2f%% is at or above the %d%% floor\n", p, f
          }'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.txt

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    # Only on pull requests: the comparison is PR-versus-merge-base, so there
    # is nothing to compare on a push to main.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need the merge base to measure against.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install critcmp
        run: cargo install critcmp --locked
      # Both sides are measured back to back on the *same* runner. Comparing
      # against a stored baseline from an earlier job would report double-digit
      # swings on identical code, because GitHub runner performance varies far
      # more between jobs than most real regressions do.
      # `cargo bench` directly rather than `cargo xtask bench`: the merge base
      # is arbitrary older code, and it cannot be assumed to have whatever
      # tasks the current xtask defines. The flags are kept in step with
      # `run_bench` in xtask/src/main.rs.
      # `--manifest-path`, not `-p`: this job checks out the *merge base* to get
      # a baseline, and a package renamed in this PR does not exist under its
      # new name at that revision. The directory does exist at both, which is
      # one of the reasons the crates.io rename (ADR-0014) left directory names
      # alone. Addressing the crate by path makes the comparison work across
      # any future rename too.
      - name: Measure the merge base
        run: |
          git checkout --detach ${{ github.event.pull_request.base.sha }}
          cargo bench --manifest-path crates/lumina-bench/Cargo.toml \
            -- --warm-up-time 1 --measurement-time 3 \
            --save-baseline base
      - name: Measure this pull request
        run: |
          git checkout --detach ${{ github.sha }}
          cargo bench --manifest-path crates/lumina-bench/Cargo.toml \
            -- --warm-up-time 1 --measurement-time 3 \
            --save-baseline pr
      - name: Compare
        run: |
          critcmp base pr | tee bench-comparison.txt
      - name: Fail on a large regression
        run: |
          # The threshold is 25%, not the 5% the programme originally proposed.
          # Same-runner comparison removes most cross-job variance, but not all
          # of it: a shared CI machine still drifts by more than 5% between two
          # runs of the same code. A gate that fires on noise gets disabled, and
          # ENGINEERING_PRINCIPLES #6 treats a flaky test as a bug.
          #
          # 25% is comfortably above that floor and comfortably below the size
          # of the regressions this is meant to catch — removing a cache or
          # reintroducing a per-frame allocation costs far more than a quarter.
          python3 .github/scripts/check_bench_regression.py bench-comparison.txt 25
      - name: Upload comparison
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-comparison
          path: bench-comparison.txt
          if-no-files-found: ignore

  examples:
    name: Examples render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      # ENGINEERING_PRINCIPLES #12: a broken example is a broken build. This
      # renders every scene in examples/ with the documented command, which is
      # the only way that principle is actually enforced rather than asserted.
      - run: cargo xtask examples

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # v2 ships a current Cargo that understands Cargo.lock format v4.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check

  # ── Docs site (mdBook) ──────────────────────────────────────────────────────
  book:
    name: Docs Site (mdBook)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the versioned site is built from every release tag,
          # and a shallow clone has none of them.
          fetch-depth: 0
      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # Every pull request builds the book, so a broken page fails the PR that
      # broke it rather than the next deploy.
      - run: mdbook build docs

      # The deployed site is assembled from the tags, not from this checkout
      # alone: the newest release at the root, `main` under /dev/, and every
      # release that still builds under /vX.Y.Z/. Old documentation stops
      # disappearing the moment a new version ships.
      #
      # `fetch-depth: 0` above is what makes the tags available; without it the
      # script would find none and publish only `dev`.
      - name: Assemble the versioned site
        if: github.ref == 'refs/heads/main'
        run: ./docs/scripts/build-versioned.sh site
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  # ── Deploy docs to GitHub Pages (main only) ───────────────────────────────────
  deploy-docs:
    name: Deploy Docs Site
    needs: book
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
