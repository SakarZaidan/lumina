# OpenSSF Scorecard: an outside opinion on this repository's supply-chain
# posture, scored against checks we did not write.
#
# Worth having precisely because it is not self-assessment. The project keeps
# its own quality scorecard in `planning/METRICS.md`, and a metric you grade
# yourself is one you can talk yourself into. Scorecard checks branch
# protection, pinned dependencies, token permissions, and whether a security
# policy exists — mechanically, from the outside.
name: Scorecard

on:
  schedule:
    - cron: "30 7 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Publishing the result to the OpenSSF API, which is what makes the badge
      # resolve. Nothing here writes to the repository.
      id-token: write
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v3
        with:
          sarif_file: results.sarif
