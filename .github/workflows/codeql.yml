# CodeQL static analysis.
#
# Distinct from clippy: clippy reads one function at a time, CodeQL follows
# data across function and crate boundaries, which is where the interesting
# defects in this codebase have actually lived. The two `AAA-SEC` findings that
# mattered most — an unbounded allocation reachable from a request body, and a
# blocking render on an async worker — were both about a value's *path* through
# the program rather than any single expression.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "45 7 * * 2"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Rust
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          languages: rust
          build-mode: manual
      # `build-mode: manual` because the workspace excludes `luminafx-wasm`
      # from a host build: it targets wasm32 and an autobuild would try to
      # compile it here and fail.
      - run: cargo build --workspace --exclude luminafx-wasm --all-targets
      - uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          category: "/language:rust"
