# CodeQL static analysis.
#
# Distinct from clippy: clippy reads one function at a time, CodeQL follows
# data across function and crate boundaries, which is where the interesting
# defects in this codebase have actually lived. The two `AAA-SEC` findings that
# mattered most — an unbounded allocation reachable from a request body, and a
# blocking render on an async worker — were both about a value's *path* through
# the program rather than any single expression.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "45 7 * * 2"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Rust
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `build-mode: none` is the only mode the Rust extractor supports — it
      # reads the source rather than observing a build, and `manual` is a
      # configuration error it refuses outright. That also removes the reason
      # this job previously installed a toolchain and compiled the workspace:
      # nothing here builds, so nothing needs a compiler or a cache.
      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v3
        with:
          languages: rust
          build-mode: none
      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v3
        with:
          category: "/language:rust"
