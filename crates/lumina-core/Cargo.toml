[package]
name = "luminafx-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Animation runtime for the Lumina engine: scene graph, keyframe timeline, easings, interpolation, events, scene patching"
keywords = ["animation", "timeline", "easing", "interpolation", "keyframes"]
categories = ["graphics", "multimedia"]
readme = "../../README.md"

[dependencies]
luminafx-schema = { path = "../lumina-schema", version = "0.5.0" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# Read at validation time to learn each object type's properties from the
# real structs (RFC-0002). Already in the graph through luminafx-schema, so
# this adds an edge, not a crate.
schemars = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true
