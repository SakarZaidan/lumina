[package]
name = "lumina-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "HTTP API server for the Lumina animation engine: validation, rendering, scene patching"
# Application crate, not a library product; not production-hardened yet (see
# planning/TECH_DEBT.md TD-09 and planning/DECISIONS.md D-009).
publish = false

[[bin]]
name = "lumina-server"
path = "src/main.rs"

[lib]
name = "lumina_server"
path = "src/lib.rs"

[dependencies]
lumina-core = { path = "../lumina-core" }
lumina-renderer = { path = "../lumina-renderer" }
lumina-schema = { path = "../lumina-schema" }
lumina-export = { path = "../lumina-export" }
axum = { workspace = true, features = ["macros"] }
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
json-patch = "1"
tower-http = { version = "0.5", features = ["cors"] }
anyhow = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
tempfile = "3.10"
