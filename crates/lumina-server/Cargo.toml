[package]
name = "luminafx-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "HTTP API server for the Lumina animation engine: validation, rendering, scene patching"
# Application crate, not a library product; not production-hardened yet (see
# planning/TECH_DEBT.md TD-09 and planning/DECISIONS.md ADR-0009).
publish = false

[[bin]]
name = "luminafx-server"
path = "src/main.rs"

[lib]
name = "luminafx_server"
path = "src/lib.rs"

[dependencies]
luminafx-core = { path = "../lumina-core", version = "0.4.0" }
luminafx-renderer = { path = "../lumina-renderer", version = "0.4.0" }
luminafx-schema = { path = "../lumina-schema", version = "0.4.0" }
luminafx-export = { path = "../lumina-export", version = "0.4.0" }
axum = { workspace = true, features = ["macros"] }
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
json-patch = "1"
tower-http = { version = "0.5", features = ["cors"] }
log = { workspace = true }
env_logger = { workspace = true }
tempfile = "3.10"

[lints]
workspace = true
