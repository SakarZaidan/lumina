[package]
name = "luminafx-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "WebAssembly bindings for the Lumina animation engine: in-browser rendering, events, hit-testing"
# Ships via npm as part of the JavaScript SDK, not via crates.io (ADR-0009).
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
luminafx-core = { path = "../lumina-core", version = "0.4.0" }
luminafx-renderer = { path = "../lumina-renderer", version = "0.4.0" }
luminafx-schema = { path = "../lumina-schema", version = "0.4.0" }
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["CanvasRenderingContext2d", "HtmlCanvasElement", "Window", "Document"] }
console_error_panic_hook = "0.1"
serde_json = { workspace = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[lints]
workspace = true
