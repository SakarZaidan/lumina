# Standalone workspace so the Python extension is built only via maturin and
# never pulled into the main `cargo test --workspace` gate (which has no Python
# interpreter linked).
[workspace]

[package]
name = "luminafx-py"
version = "0.6.0"
edition = "2021"
license = "MIT"
description = "Python bindings for the Lumina animation engine"

[lib]
# The extension module's name, which is what `import` sees. `luminafx`, not
# `lumina`: PyPI's `lumina` installs a top-level `Lumina`, which is a distinct
# name on Linux and the *same* name on macOS and Windows, where filesystems are
# case-insensitive. Shipping a collision that only appears on two of three
# platforms is worse than not shipping one. Matches the distribution name too,
# so `pip install luminafx` then `import luminafx` reads as one thing.
name = "luminafx"
crate-type = ["cdylib"]

[dependencies]
# `luminafx-core`, not `luminafx-server`. The SDK needed the server for one
# function, `validate_scene_data`, which lives in core and is only re-exported
# there — and the server is `publish = false`, so an sdist naming it could
# never have been built by anyone installing from PyPI. Dropping it also takes
# axum and tokio out of this crate's build.
luminafx-core = { path = "../../crates/lumina-core", version = "0.6.0" }
luminafx-schema = { path = "../../crates/lumina-schema", version = "0.6.0" }
luminafx-renderer = { path = "../../crates/lumina-renderer", version = "0.6.0" }
luminafx-export = { path = "../../crates/lumina-export", version = "0.6.0" }
# `abi3-py39` builds against Python's stable ABI, so one wheel per platform
# works on 3.9 and every version after it — including ones that did not exist
# when the wheel was built. Without it pyo3 compiles against the exact
# interpreter present, and the macOS runner's Python 3.14 is newer than
# pyo3 0.22 supports, so that wheel simply could not be built. The floor
# matches `requires-python = ">=3.9"` in pyproject.toml.
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py39"] }
pythonize = "0.22"
schemars = "0.8"
serde_json = "1.0"
