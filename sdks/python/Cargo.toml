# Standalone workspace so the Python extension is built only via maturin and
# never pulled into the main `cargo test --workspace` gate (which has no Python
# interpreter linked).
[workspace]

[package]
name = "luminafx-py"
version = "0.4.0"
edition = "2021"
license = "MIT"
description = "Python bindings for the Lumina animation engine"

[lib]
name = "lumina"
crate-type = ["cdylib"]

[dependencies]
luminafx-schema = { path = "../../crates/lumina-schema", version = "0.4.0" }
luminafx-renderer = { path = "../../crates/lumina-renderer", version = "0.4.0" }
luminafx-export = { path = "../../crates/lumina-export", version = "0.4.0" }
luminafx-server = { path = "../../crates/lumina-server", version = "0.4.0" }
pyo3 = { version = "0.22", features = ["extension-module"] }
pythonize = "0.22"
schemars = "0.8"
serde_json = "1.0"
