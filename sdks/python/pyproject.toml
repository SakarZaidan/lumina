[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "luminafx"
version = "0.5.0"
description = "Python bindings for Lumina — a declarative, GPU-capable animation engine (JSON in, video out)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Sakar Hashim" }]
keywords = ["animation", "rendering", "video", "math", "manim", "latex"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
    "License :: OSI Approved :: MIT License",
]

[project.urls]
Homepage = "https://github.com/SakarZaidan/lumina"
Repository = "https://github.com/SakarZaidan/lumina"

[tool.maturin]
# Matches the `[lib]` name and the distribution name, so `pip install luminafx`
# then `import luminafx` reads as one thing rather than two.
module-name = "luminafx"
