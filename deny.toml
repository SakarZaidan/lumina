[graph]
targets = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "0BSD",
    # Permissive licenses pulled in transitively by wgpu / vello / image / resvg.
    "NCSA",
    "MPL-2.0", # weak, file-level copyleft — fine for an MIT app to depend on
]
exceptions = [
    # vello's font shaping dep uses the OFL-1.1 font license — data only, not code
    { allow = ["OFL-1.1"], name = "noto-sans-data" },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    # Unmaintained transitive deps of wgpu/vello with no upgrade available.
    # Not vulnerabilities — informational "unmaintained" advisories only.
    "RUSTSEC-2024-0436", # paste (via wgpu → vello, and exr → image)
    # ttf-parser parses untrusted font files, so "unmaintained" matters more
    # here than for the two above. resvg 0.47 moved to maintained
    # ttf-parser 0.25, so the untrusted-SVG path is clean; only fontdue
    # 0.9.3 (latest release) still pins 0.21 for scene-declared font
    # assets. Revisit when fontdue releases on a maintained ttf-parser or
    # is replaced (TD-17 in planning/TECH_DEBT.md).
    "RUSTSEC-2026-0192", # ttf-parser 0.21 (via fontdue 0.9 only)
    # rustybuzz reaches us through usvg/resvg 0.47 — already the latest
    # release, so there is nothing to upgrade to. It shapes text inside
    # untrusted SVG assets, so this is tracked rather than dismissed
    # (TD-22 in planning/TECH_DEBT.md); revisit on the next resvg release.
    "RUSTSEC-2026-0206", # rustybuzz (via usvg → resvg 0.47)
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
