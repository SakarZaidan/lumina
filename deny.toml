[graph]
targets = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "0BSD",
    # Permissive licenses pulled in transitively by wgpu / vello / image / resvg.
    "NCSA",
    "MPL-2.0", # weak, file-level copyleft — fine for an MIT app to depend on
]
exceptions = [
    # vello's font shaping dep uses the OFL-1.1 font license — data only, not code
    { allow = ["OFL-1.1"], name = "noto-sans-data" },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    # Unmaintained transitive deps of wgpu/vello with no upgrade available.
    # Not vulnerabilities — informational "unmaintained" advisories only.
    "RUSTSEC-2024-0436", # paste (via wgpu → vello)
    "RUSTSEC-2025-0057", # fxhash (via wgpu-core)
    # ttf-parser parses untrusted font files, so "unmaintained" matters more
    # here than for the two above — revisit when fontdue/resvg bump their
    # ttf-parser pin (tracked as TD-17 in planning/TECH_DEBT.md).
    "RUSTSEC-2026-0192", # ttf-parser (via fontdue 0.9 / resvg 0.42)
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
