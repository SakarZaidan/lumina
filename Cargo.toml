[workspace]
members = [
    "crates/lumina-core",
    "crates/lumina-renderer",
    "crates/lumina-text",
    "crates/lumina-schema",
    "crates/lumina-export",
    "crates/lumina-server",
    "crates/lumina-wasm",
    "crates/lumina-bench",
    "tools/lumina-cli",
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
# Probed floor with the committed Cargo.lock (home/image require rustc 1.88).
rust-version = "1.88"
authors = ["Sakar Hashim"]
license = "MIT"
repository = "https://github.com/SakarZaidan/lumina"
homepage = "https://github.com/SakarZaidan/lumina"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
schemars = "1.2"
glam = "0.27" # For linear algebra
vello = "0.2"
wgpu = "22.1"
tiny-skia = "0.11"
fontdue = "0.9"
mitex = "0.2"
resvg = "0.42"
image = "0.25"
clap = { version = "4.5", features = ["derive"] }
axum = "0.7"
rayon = "1.10"
evalexpr = "11"
notify = "6"
