[workspace]
members = [
    "crates/lumina-core",
    "crates/lumina-renderer",
    "crates/lumina-text",
    "crates/lumina-schema",
    "crates/lumina-export",
    "crates/lumina-server",
    "crates/lumina-wasm",
    "crates/lumina-bench",
    "tools/lumina-cli",
    "xtask",
]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2021"
# Probed floor with the committed Cargo.lock (home/image require rustc 1.88).
rust-version = "1.88"
authors = ["Sakar Hashim"]
license = "MIT"
repository = "https://github.com/SakarZaidan/lumina"
homepage = "https://github.com/SakarZaidan/lumina"

# Lint policy for the whole workspace, so it is stated once rather than
# copy-pasted into every crate root. Crates opt in with `[lints] workspace = true`.
#
# `unwrap_used`/`expect_used` are warnings rather than errors *for now*: two
# call sites remain in production code (validation.rs and skia_backend.rs, both
# provably guarded and documented in planning/METRICS.md). CI runs with
# `-D warnings`, so they still fail the build — the distinction is that a
# `#[allow]` with a justification is the intended escape hatch, and denying
# outright would make that impossible to express.
[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
# Correctness and clarity, not style enforcement for its own sake.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
# These fire on genuinely error-prone patterns rather than taste.
cast_possible_truncation = "allow"  # pervasive and deliberate at JSON boundaries
doc_markdown = "warn"
explicit_iter_loop = "warn"
needless_pass_by_value = "warn"
redundant_clone = "warn"
uninlined_format_args = "warn"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
schemars = "0.8"
glam = "0.27" # For linear algebra
vello = "0.2"
wgpu = "22.1"
tiny-skia = "0.12"
fontdue = "0.9"
resvg = "0.47"
image = "0.25"
clap = { version = "4.5", features = ["derive"] }
axum = "0.7"
rayon = "1.10"
evalexpr = "11"
notify = "6"
proptest = "1"
