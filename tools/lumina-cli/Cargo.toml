[package]
name = "luminafx-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Command-line renderer for Lumina scenes (.lsf): PNG/MP4/WebM/GIF on CPU or GPU backends"
keywords = ["animation", "cli", "rendering", "video"]
categories = ["command-line-utilities", "multimedia::video"]
readme = "../../README.md"

[lib]
# The logic lives in a library so it can be tested: the binary measured 0%
# coverage while the rest of the workspace sat above 80%, for the ordinary
# reason that a `main` cannot be called (TD-10).
name = "luminafx_cli"
path = "src/lib.rs"

[[bin]]
# Explicit, because the binary name defaults to the package name. The package
# had to become `luminafx-cli` (crates.io has a `lumina-cli` already, an
# unrelated Celestia node), and without this the command every doc and example
# invokes would have been renamed along with it.
name = "lumina-cli"
path = "src/main.rs"

[dependencies]
luminafx-core = { path = "../../crates/lumina-core", version = "0.5.0" }
luminafx-renderer = { path = "../../crates/lumina-renderer", version = "0.5.0" }
luminafx-schema = { path = "../../crates/lumina-schema", version = "0.5.0" }
schemars = { workspace = true }
luminafx-export = { path = "../../crates/lumina-export", version = "0.5.0" }
clap = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
anyhow = { workspace = true }
env_logger = { workspace = true }
log = { workspace = true }
notify = { workspace = true }
image = { workspace = true }

[lints]
workspace = true
