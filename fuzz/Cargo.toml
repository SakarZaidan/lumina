[workspace]
# Kept out of the main workspace on purpose: libfuzzer-sys requires a nightly
# toolchain and sanitizer flags, so `cargo check --workspace` must not see it.

[package]
name = "luminafx-fuzz"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"
description = "Fuzz targets for Lumina's untrusted-input parsers."

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
luminafx-core = { path = "../crates/lumina-core", version = "0.4.0" }
luminafx-schema = { path = "../crates/lumina-schema", version = "0.4.0" }
luminafx-renderer = { path = "../crates/lumina-renderer", version = "0.4.0" }
serde_json = "1"

[[bin]]
name = "scene_json"
path = "fuzz_targets/scene_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "svg_path"
path = "fuzz_targets/svg_path.rs"
test = false
doc = false
bench = false

[[bin]]
name = "latex_unicode"
path = "fuzz_targets/latex_unicode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "plot_expression"
path = "fuzz_targets/plot_expression.rs"
test = false
doc = false
bench = false
